<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends Poker</title><style>body{margin:0;background:#08150f;color:#fff;font-family:system-ui;text-align:center}.wrap{max-width:760px;margin:auto;padding:24px}.table{margin:24px auto;background:#12633d;border:10px solid #4b2e1c;border-radius:45%;min-height:360px;padding:30px;box-shadow:0 20px 50px #0008}.players{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.p{background:#111c;padding:12px;border-radius:14px;min-width:120px}input,button{font-size:16px;padding:12px;margin:5px;border:0;border-radius:10px}button{font-weight:700}.actions button{min-width:100px}.muted{opacity:.7}</style></head><body><div class="wrap"><h1>🃏 Friends Poker</h1><div id="login"><input id="name" placeholder="昵称"><input id="room" value="8888" placeholder="房间号"><button onclick="join()">进入牌桌</button></div><div id="game" hidden><div class="table"><h2>房间 <span id="rid"></span></h2><h3>底池：<span id="pot">0</span></h3><div class="players" id="players"></div></div><div class="actions"><button onclick="act('fold')">弃牌 Fold</button><button onclick="act('check')">过牌 Check</button><button onclick="act('bet')">下注 100</button></div><p class="muted">娱乐筹码，无充值、提现或真钱兑换。</p></div></div><script src="/socket.io/socket.io.js"></script><script>const s=io();function join(){let name=document.querySelector('#name').value||'Player',room=document.querySelector('#room').value||'8888';s.emit('join',{name,room});rid.textContent=room;login.hidden=true;game.hidden=false}function act(a){s.emit('action',a)}s.on('state',r=>{pot.textContent=r.pot;players.innerHTML=r.players.map(p=>`<div class=p><b>${p.name}</b><br>💰 ${p.chips}<br>${p.status}</div>`).join('')})</script></body></html>
