<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Friends Poker</title>

<style>

body{
margin:0;
background:#06150e;
color:white;
font-family:system-ui;
text-align:center;
}


.wrap{
max-width:900px;
margin:auto;
padding:20px;
}


.table{

background:#12633d;
border:12px solid #4b2e1c;
border-radius:50%;
min-height:500px;
padding:40px;

}


.cards{

font-size:45px;
margin:20px;

}


.card{

background:white;
color:black;
padding:10px;
border-radius:10px;
margin:5px;
display:inline-block;

}


.players{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}


.player{

background:#102019;
padding:15px;
border-radius:15px;
min-width:130px;

}


button{

font-size:18px;
padding:12px 25px;
margin:5px;
border-radius:10px;

}

</style>

</head>


<body>


<div class="wrap">


<h1>🃏 Friends Poker</h1>



<div id="login">

<input id="name" placeholder="昵称">

<input id="room" value="8888">

<button onclick="join()">
进入牌桌
</button>

</div>



<div id="game" hidden>


<div class="table">


<h2>
房间 <span id="rid"></span>
</h2>


<h3>
底池:
<span id="pot">
0
</span>
</h3>



<h2>
公共牌
</h2>


<div id="board" class="cards">

</div>



<h2>
我的手牌
</h2>


<div id="mycards" class="cards">

</div>



<h2>
玩家
</h2>


<div id="players" class="players">

</div>



</div>




<button onclick="act('fold')">
弃牌 Fold
</button>


<button onclick="act('check')">
过牌 Check
</button>


<button onclick="act('bet')">
下注100
</button>




</div>


</div>




<script src="/socket.io/socket.io.js"></script>


<script>


const socket=io();


let myName="";



function join(){


myName=document.querySelector("#name").value || "Player";


let room=document.querySelector("#room").value;


socket.emit("join",{

name:myName,
room

});


rid.textContent=room;


login.hidden=true;

game.hidden=false;


}



function act(a){

socket.emit("action",a);

}




socket.on("state",room=>{


pot.textContent=room.pot;



// 公共牌

board.innerHTML=
room.board
.map(c=>`<span class="card">${c}</span>`)
.join("");



// 我的牌

let me=
room.players.find(
p=>p.name===myName
);



if(me && me.cards){


mycards.innerHTML=
me.cards
.map(c=>`<span class="card">${c}</span>`)
.join("");


}



// 玩家

players.innerHTML=
room.players
.map(p=>`

<div class="player">

<b>${p.name}</b>

<br>

💰 ${p.chips}

<br>

${p.status}

</div>

`)
.join("");



});



</script>


</body>
</html>
