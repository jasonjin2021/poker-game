<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friends Poker V2</title>
<style>
:root{--bg:#06130d;--felt:#0f6a3e;--felt2:#0b5733;--rail:#5b351f;--panel:#101915;--gold:#f6c85f;--red:#d94b4b}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 20%,#123624,#06130d 55%);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:28px;font-weight:900}.pill{background:#ffffff13;border:1px solid #ffffff24;padding:8px 12px;border-radius:999px}
.login{max-width:520px;margin:12vh auto;background:#0f1c16;border:1px solid #ffffff1b;border-radius:24px;padding:28px;box-shadow:0 30px 80px #0008}.login h1{margin-top:0}.login input{width:100%;padding:14px 16px;margin:7px 0;background:#07110c;border:1px solid #ffffff28;color:#fff;border-radius:12px}.primary{width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:#f4f4f4;color:#111;font-weight:900;cursor:pointer}
.tableWrap{position:relative;margin:24px auto;max-width:1050px;min-height:610px}.table{position:absolute;inset:55px 55px 80px;border:12px solid var(--rail);border-radius:48%;background:radial-gradient(ellipse at center,var(--felt),var(--felt2));box-shadow:inset 0 0 80px #0005,0 30px 80px #0009}.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;width:70%;z-index:2}.board{display:flex;justify-content:center;gap:9px;min-height:90px}.card{width:62px;height:88px;border-radius:8px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900;box-shadow:0 4px 14px #0008;border:1px solid #ddd}.card.red{color:#c62828}.card.back{background:repeating-linear-gradient(45deg,#1d3f6e 0 7px,#fff 7px 9px);border:5px solid #fff;color:transparent}.pot{font-weight:900;font-size:20px;margin-top:10px}.stage{opacity:.8;margin:6px}
.seats{position:absolute;inset:0;z-index:3}.player{position:absolute;width:170px;min-height:108px;padding:11px;border-radius:16px;background:#101a16eF;border:1px solid #ffffff22;box-shadow:0 8px 25px #0008;text-align:center;transform:translate(-50%,-50%)}.player.turn{outline:3px solid var(--gold);box-shadow:0 0 25px #f6c85f66}.player.me{background:#17251e}.player.folded{opacity:.48}.player .name{font-weight:900}.badges{font-size:12px;color:#ffd86b;min-height:17px}.chips{margin:3px 0}.bet{font-size:13px;color:#9de0ba}.hole{display:flex;justify-content:center;gap:5px;margin-top:6px}.hole .card{width:36px;height:50px;font-size:15px;border-radius:5px}.status{font-size:12px;opacity:.75}
.actions{max-width:900px;margin:-35px auto 0;position:relative;z-index:5;background:#0d1712dd;border:1px solid #ffffff1c;border-radius:18px;padding:13px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;backdrop-filter:blur(8px)}.actions button{border:0;border-radius:11px;padding:12px 17px;font-weight:900;cursor:pointer}.actions button:disabled{opacity:.35;cursor:not-allowed}.fold{background:#e45a5a}.check{background:#e8e8e8}.call{background:#75d99b}.raise{background:#f4c65e}.allin{background:#b98cf4}.small{padding:8px 12px!important;background:#ffffff16!important;color:#fff}
.raiseBox{display:flex;align-items:center;gap:6px}.raiseBox input{width:100px;padding:10px;border-radius:9px;border:1px solid #ffffff33;background:#07110c;color:#fff}.msg{text-align:center;font-weight:800;margin:10px}.timer{height:5px;background:#ffffff18;border-radius:10px;overflow:hidden;max-width:420px;margin:8px auto}.timer>div{height:100%;background:#f6c85f;width:100%}
.actionHint{width:100%;text-align:center;min-height:18px;font-size:12px;color:#d7e7de;opacity:.8}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px auto;max-width:1000px}.panel{background:#0f1a15;border:1px solid #ffffff17;border-radius:16px;padding:14px}.panel h3{margin:0 0 8px}.log{font-size:13px;opacity:.82;line-height:1.6;max-height:145px;overflow:auto}.notice{opacity:.6;text-align:center;font-size:12px;margin:16px}
@media(max-width:760px){.app{padding:10px}.brand{font-size:21px}.tableWrap{min-height:570px}.table{inset:75px 12px 95px;border-width:8px}.player{width:135px;min-height:98px;font-size:13px}.card{width:46px;height:68px;font-size:19px}.center{width:85%}.bottom{grid-template-columns:1fr}.actions{margin-top:-55px}.raiseBox input{width:80px}}
</style>
</head>
<body>
<div class="app">
  <div id="login" class="login">
    <h1>🃏 Friends Poker V2</h1>
    <p>纯娱乐筹码 · 2–9 人实时联机</p>
    <input id="name" maxlength="16" placeholder="你的昵称">
    <input id="room" maxlength="12" value="8888" placeholder="房间号">
    <button class="primary" onclick="join()">进入牌桌</button>
  </div>

  <div id="game" hidden>
    <div class="top">
      <div class="brand">🃏 Friends Poker</div>
      <div>
        <span class="pill">房间 <b id="rid"></b></span>
        <button class="small" onclick="toggleSitOut()" id="sitBtn">暂停游戏</button>
      </div>
    </div>

    <div class="tableWrap">
      <div class="table"></div>
      <div id="seats" class="seats"></div>
      <div class="center">
        <div class="stage" id="stage">等待中</div>
        <div class="board" id="board"></div>
        <div class="pot">底池 🪙 <span id="pot">0</span></div>
        <div class="stage">当前下注：<span id="currentBet">0</span></div>
      </div>
    </div>

    <div id="msg" class="msg"></div>
    <div class="timer"><div id="timerBar"></div></div>

    <div class="actions">
      <button class="fold" id="foldBtn" onclick="act('fold')">弃牌 Fold</button>
      <button class="check" id="checkBtn" onclick="act('check')">过牌 Check</button>
      <button class="call" id="callBtn" onclick="act('call')">跟注 Call</button>
      <div class="raiseBox">
        <input id="raiseAmount" type="number" step="50" min="100" aria-label="下注或加注后的总额">
        <button class="raise" id="raiseBtn" onclick="raiseBet()">加注 Raise</button>
      </div>
      <button class="allin" id="allinBtn" onclick="act('allin')">All-in</button>
      <button class="small" id="startBtn" onclick="startNow()" hidden>开始下一局</button>
      <div id="actionHint" class="actionHint"></div>
    </div>

    <div class="bottom">
      <div class="panel"><h3>游戏信息</h3><div id="info"></div></div>
      <div class="panel"><h3>牌桌记录</h3><div id="log" class="log"></div></div>
    </div>
    <div class="notice">娱乐筹码，无充值、提现或真钱兑换。刷新页面会重新连接；免费服务器休眠后首次打开可能较慢。</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let state = null;
let timerRAF = null;
const $ = id => document.getElementById(id);

function join(){
  const name = $("name").value.trim() || "Player";
  const room = $("room").value.trim() || "8888";
  localStorage.setItem("pokerName", name);
  localStorage.setItem("pokerRoom", room);
  socket.emit("join",{name,room});
  $("login").hidden = true;
  $("game").hidden = false;
}
$("name").value = localStorage.getItem("pokerName") || "";
$("room").value = localStorage.getItem("pokerRoom") || "8888";

function act(type){ socket.emit("action",{type}); }
function raiseBet(){
  const amount = Number($("raiseAmount").value);
  socket.emit("action",{type:"raise",amount});
}
function toggleSitOut(){ socket.emit("toggleSitOut"); }
function startNow(){ socket.emit("startNow"); }

function cardHTML(t, small=false){
  if(!t) return "";
  if(t==="BACK") return `<div class="card back"></div>`;
  const red = t.includes("♥") || t.includes("♦");
  return `<div class="card ${red?"red":""}">${t}</div>`;
}
function seatPosition(i,n){
  // place seats around an ellipse; seat 0 starts at bottom
  const angle = Math.PI/2 + (i/n)*Math.PI*2;
  const x = 50 + 43*Math.cos(angle);
  const y = 50 + 42*Math.sin(angle);
  return [x,y];
}
function stageName(s){
  return ({waiting:"等待玩家",preflop:"翻牌前 Pre-flop",flop:"翻牌 Flop",turn:"转牌 Turn",river:"河牌 River",showdown:"摊牌 Showdown"})[s] || s;
}
function render(r){
  state = r;
  $("rid").textContent = r.room;
  $("pot").textContent = r.pot;
  $("currentBet").textContent = r.currentBet;
  $("stage").textContent = `${stageName(r.stage)} · 第 ${r.handNumber} 局`;
  $("msg").textContent = r.message || "";
  $("board").innerHTML = r.board.map(cardHTML).join("") + Array(Math.max(0,5-r.board.length)).fill('<div class="card" style="opacity:.12"></div>').join("");

  const ps = r.players;
  $("seats").innerHTML = ps.map((p,i)=>{
    const [x,y] = seatPosition(i,Math.max(ps.length,2));
    const cls = `player ${p.id===r.me?"me":""} ${p.id===r.turnId?"turn":""} ${p.folded?"folded":""}`;
    const badges = `${p.isDealer?"D ":""}${p.isSB?"SB ":""}${p.isBB?"BB ":""}`;
    const cards = p.cards.map(cardHTML).join("");
    return `<div class="${cls}" style="left:${x}%;top:${y}%">
      <div class="badges">${badges}</div>
      <div class="name">${escapeHtml(p.name)}</div>
      <div class="chips">🪙 ${p.chips}</div>
      <div class="bet">${p.streetBet ? "本轮 "+p.streetBet : "&nbsp;"}</div>
      <div class="hole">${cards}</div>
      <div class="status">${p.status}</div>
    </div>`;
  }).join("");

  const L = r.legal || {};
  $("foldBtn").disabled = !L.fold;
  $("checkBtn").disabled = !L.check;
  $("callBtn").disabled = !L.call;
  $("callBtn").textContent = L.call ? `跟注 ${L.callAmount}` : "跟注 Call";
  $("raiseBtn").disabled = !L.raise;
  $("raiseBtn").textContent = L.betLabel || "加注 Raise";
  $("allinBtn").disabled = !L.allIn;
  $("raiseAmount").disabled = !L.raise;
  if(L.raise){
    $("raiseAmount").min = L.minRaiseTo;
    $("raiseAmount").max = L.maxRaiseTo;
    const entered = Number($("raiseAmount").value);
    if(!entered || entered<L.minRaiseTo || entered>L.maxRaiseTo){
      $("raiseAmount").value = L.minRaiseTo;
    }
    $("actionHint").textContent = `${r.currentBet===0?"最低下注":"最低加注到"} ${L.minRaiseTo} · 输入的是本轮总额`;
  } else if(L.allIn && r.turnId===r.me) {
    $("actionHint").textContent = L.call
      ? "筹码不足或加注权未开放；仍可跟注、弃牌或 All-in"
      : "可过牌或 All-in";
  } else {
    $("actionHint").textContent = "";
  }
  $("startBtn").hidden = !r.canStart;

  const me = ps.find(p=>p.id===r.me);
  $("sitBtn").textContent = me && me.sittingOut ? "回到游戏" : "暂停游戏";
  $("info").innerHTML = me ? `你的筹码：<b>${me.chips}</b><br>状态：${me.status}<br>座位：${me.seat}` : "";
  $("log").innerHTML = (r.log||[]).map(x=>`<div>${escapeHtml(x)}</div>`).join("");
  animateTimer(r.actionDeadline, r.turnId===r.me);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function animateTimer(deadline,myTurn){
  if(timerRAF) cancelAnimationFrame(timerRAF);
  const bar = $("timerBar");
  function tick(){
    if(!deadline){bar.style.width="0%";return}
    const left = Math.max(0, deadline-Date.now());
    bar.style.width = Math.min(100,left/25000*100)+"%";
    bar.style.opacity = myTurn ? "1" : ".45";
    if(left>0) timerRAF=requestAnimationFrame(tick);
  }
  tick();
}
socket.on("state", render);
socket.on("connect", ()=>{
  if(!$("game").hidden){
    socket.emit("join",{name:localStorage.getItem("pokerName")||"Player",room:localStorage.getItem("pokerRoom")||"8888"});
  }
});
</script>
</body>
</html>
